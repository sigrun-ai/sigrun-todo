# CI: thin caller over the family's reusable workflow in sigrun-ai/sigrun
# (release workstream Task 2.2) — the jobs live there so they cannot
# drift across the family repos. needs-core: true (the @sigrun/sigrun and
# @sigrun/shared devDeps are file: links to sibling checkouts, so core is
# checked out at `sigrun` and built before this repo's install).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: sigrun-ai/sigrun/.github/workflows/ext-ci.yml@main
    with:
      needs-core: true
